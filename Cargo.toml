[package]
name = "zalaga"
version = "0.0.1"
edition = "2024"
description = "Zalaga, a low-level programming language inspired by C, Python and Rust."
license = "MIT"
repository = "https://github.com/FiredMercury21/zalaga"

[dependencies]
ariadne = { version = "0.6", features = ["auto-color"] }
serde = { version = "1.0", features = ["derive"] }
byteorder = "1.4"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
